# The dsh-kenari-plugin bundle patch. Applied after the dsh-base and
# dsh-web-app layers, addressing their rows by id; the last write wins per row.
#
# A patch replaces the targeted row's whole `config` rather than merging into
# it, so a row overridden here must restate every key it owns. `disabled` is a
# key of the row itself, independent of `config`.
#
# dsh-web-app disables the `tool-web` row on the web profile by patching
# `disabled: true` (its own patch writes no config), so re-enabling needs only
# `disabled: false` — the row's base config (fetch: true, searchTimeoutMs:
# 60000) stays intact.

- insert:
    # The main plugin: registers web providers, tools, and settings sections.
    - id: kenari
      name: dsh-kenari-plugin

# Pin the composed Kenari-first provider into the web seam. Both keys must be
# restated: replacing `config` drops anything omitted.
- id: web
  config:
    searchProvider: kenari-fallback
    fetchProvider: kenari-fallback

# Re-enable the web tools that dsh-web-app disabled for the web profile.
- id: tool-web
  disabled: false

# ---------------------------------------------------------------------------
# Kenari as a session model — zero-code preset on the dormant `llm-pi-ai` row.
#
# dsh-base mounts `llm-pi-ai` with no config, so no models exist until a
# `llm-pi-ai:` settings section supplies provider profiles. Supplying a
# `providers` dict here is the same thing the web Models page writes; the
# composition layer and a user-settings layer merge per provider route, so a
# user adding their own route (or overriding this one) still works.
#
# Everything below is verified against https://kenari.id/v1 on 2026-09-10 with
# `step-3-7-flash:free` (free, so the probe cost nothing):
#   - `max_tokens` is the output-cap field the gateway reads; sending
#     `max_completion_tokens` instead is silently ignored (HTTP 200, cap lost).
#   - `stream_options: {include_usage: true}` is accepted and the last SSE chunk
#     carries `usage`, so `supportsUsageInStreaming` is on for cached_tokens
#     accounting.
#   - streams carry `finish_reason`; tool definitions produce `tool_calls`.
#   - the [OI] line lives at `https://kenari.id/v1`; the Anthropic line is the
#     bare host `https://kenari.id` (no /v1) and Responses is /v1 again. A wrong
#     shape answers 405, not 404.
#
# The models below are a FALLBACK preset, not the whole story. `:free` models are
# deliberately absent: the intended default is whatever the account's plan gives
# free cache reads on, which only the plan table knows and only the Host can read
# at runtime (the browser cannot — /api/plans sends no CORS header). So the plugin
# computes that default on load (src/default-route.ts): plan -> its
# `free_cache_models` -> written into this route's user layer once. If the key or
# the plan is unavailable, this preset stands, and it is exactly the free-cache
# list of the Kreator and Studio plans.
#
# Consequences worth knowing: none of these four is free, so an account with no
# balance reaches HTTP 402 on its first session until it picks something else —
# the trade for not defaulting to free models. Field shape mirrors what
# src/catalog.ts's `toModelProfile()` writes, so the preset and the computed
# default produce identical entries for the same ids.
#
# Failure recovery: `retryPolicy` below must stay in sync with the plugin's
# `modelRetryMaxRetries` / `modelRetryDelayMs` (which drive the kenari-direct
# route). dsh captures a route's retry policy once, at adapter registration, and
# freezes it — so the plugin cannot change this route's retry timing at runtime.
# ---------------------------------------------------------------------------
- id: llm-pi-ai
  config:
    providers:
      kenari:
        displayName: Kenari
        apiKeyEnv: KENARI_API_KEY
        api: openai-completions
        baseURL: https://kenari.id/v1
        # A flat 5s between retries: dsh's backoff is `initialDelay * 2^n` capped
        # at `maxDelay`, so making the two equal (and disabling jitter) is the
        # only way to express "wait 5s every time".
        # CONTEXT_WINDOW_EXCEEDED is deliberately left out of the retryable set:
        # retrying the same context on the same model can only fail again, and
        # the plugin's escalation is the thing that can actually fix it.
        retryPolicy:
          mode: normal
          maxRetries: 5
          backoff:
            initialDelayMs: 5000
            maxDelayMs: 5000
            jitterRatio: 0
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
          supportsUsageInStreaming: true
          supportsFinishReason: true
          supportsReasoningEffort: true
          supportsStore: false
        defaultInput: [text]
        models:
          - id: deepseek-v4-flash
            contextWindow: 1048576
            input: [text]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: glm-5-3-flash
            contextWindow: 1000000
            input: [text, image]
            reasoningEfforts: { low: low, high: high, max: max }
          - id: gpt-5-6-luna
            contextWindow: 872000
            input: [text, image]
            reasoningEfforts: { off: none, low: low, medium: medium, high: high, xhigh: xhigh, max: max }
          - id: mimo-v2-5
            contextWindow: 1050000
            input: [text, image]
